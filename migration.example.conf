# db-migrate configuration — one file per migration.
# Create a copy with:  ./db-migrate init <name>
#
# Passwords are NEVER put here. Export them in the shell that runs the tool:
#   export SRC_PASSWORD='…' TGT_PASSWORD='…'
#   (optional) export REPL_PASSWORD='…'      — when CDC uses a separate user
#   (MongoDB)  export SRC_MONGO_URI='mongodb+srv://…'  — instead of host/user/password

MIGRATION_NAME=example            # lowercase letters, digits, _

# ── 1. Purpose ──────────────────────────────────────────────────────────────
# migration    move once and switch the applications over
# replication  keep the target continuously in sync alongside the source
PURPOSE=migration

# ── 2. Targets ──────────────────────────────────────────────────────────────
# Engines: postgres | mariadb | mysql | mongodb — any source to any target.
# A different TGT_ENGINE means a cross-engine migration: the schema is
# converted by this tool (see conversion.md after assess), full load only.
SRC_ENGINE=postgres
SRC_HOST=old-db.internal
SRC_PORT=5432
SRC_USER=migrator
SRC_DB=appdb
SRC_SSL=prefer                    # prefer | require | verify | disable
# SRC_AUTH_DB=admin               # MongoDB: database the user authenticates against

TGT_ENGINE=postgres               # defaults to SRC_ENGINE
TGT_HOST=new-db.xxxxxxxx.us-east-1.rds.amazonaws.com
TGT_PORT=5432
TGT_USER=migrator
TGT_DB=appdb                      # defaults to SRC_DB
TGT_SSL=require
# TGT_AUTH_DB=admin
TGT_MANAGED=none                  # none | rds  (RDS/Aurora MySQL/MariaDB use rds_* procedures for CDC)

# PostgreSQL source: the schemas to migrate (space-separated)
SCHEMAS="public"

# ── Cross-engine only ───────────────────────────────────────────────────────
# TGT_SCHEMA=public               # PostgreSQL target schema when the source is another engine
# TINYINT1_AS_BOOL=true           # MySQL/MariaDB TINYINT(1) → boolean (false: keep it numeric)
# MYSQL_TGT_COLLATION=utf8mb4_bin # collation of a MySQL/MariaDB target; _bin keeps PostgreSQL's
#                                 # case-sensitive text semantics

# Tables (postgres: schema.table; mariadb/mysql: table; mongodb: collection)
# whose DATA does not need to move. Their definitions are still migrated
# (MongoDB: the collection is skipped entirely).
EXCLUDE_DATA_TABLES=""

# CDC: the source address as seen FROM THE TARGET SERVER (it connects to the
# source itself). Defaults to SRC_HOST / SRC_PORT / SRC_USER.
# REPL_HOST=10.0.1.15
# REPL_PORT=5432
# REPL_USER=replicator

# ── 4. Acceptable downtime at cutover ───────────────────────────────────────
DOWNTIME_MINUTES=60

# ── 5. Acceptable replication lag ───────────────────────────────────────────
MAX_LAG_SECONDS=60

# ── 6. Deadline ─────────────────────────────────────────────────────────────
DEADLINE=                         # YYYY-MM-DD, the date the source must be retired

# ── Tuning ──────────────────────────────────────────────────────────────────
THROUGHPUT_MBPS=20                # assumed until a test run measures the real figure
MARGIN_PCT=50                     # safety margin added to the load estimate
JOBS=1                            # parallel workers (postgres/mongodb dumps; tables copied at once across engines)
STRIP_DEFINERS=true               # mariadb/mysql: drop DEFINER= clauses (definer users rarely exist on the target)
PG_KEEP_OWNERSHIP=false           # postgres: keep owners/grants (only if the same roles exist on the target)
SAMPLE_SECONDS=60                 # how long assess samples the transaction log rate
CUTOVER_WAIT_MINUTES=30           # how long cutover waits for CDC to drain
# CLIENT_MODE=auto                # docker | local | auto
# PG_IMAGE=postgres:17-alpine     # client images (must be ≥ the server version for postgres)
